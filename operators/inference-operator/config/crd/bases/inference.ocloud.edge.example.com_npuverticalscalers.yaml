---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: npuverticalscalers.inference.ocloud.edge.example.com
spec:
  group: inference.ocloud.edge.example.com
  names:
    kind: NPUVerticalScaler
    listKind: NPUVerticalScalerList
    plural: npuverticalscalers
    shortNames:
    - npuvs
    singular: npuverticalscaler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.observedTarget.currentTemplate
      name: CurrentTemplate
      type: string
    - jsonPath: .status.lastScaleTime
      name: LastScaleTime
      type: date
    - jsonPath: .status.conditions[?(@.type=='Active')].status
      name: Status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NPUVerticalScaler observes a busy-idle metric on a target ModelService and
          patches the ModelService.spec.template.sliceTemplate ref between two
          NPUSliceTemplate refs (busy / idle) to drive a "重启切片" (restart-slice)
          vertical scaling pattern.

          Per ADR-0012 §1 / §5 the scaler MUST NOT delete Pods directly; it only
          patches ModelService.spec.template.sliceTemplate and lets the existing
          inference-operator ModelService controller drive the rolling restart.
          Pod recreation invokes claim_controller (P8-T-008 wiring) to re-allocate
          per the new template.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NPUVerticalScalerSpec describes the desired scaling behaviour.
            properties:
              cooldownSeconds:
                default: 600
                description: |-
                  CooldownSeconds is the minimum gap between scaling events; prevents
                  flapping. Default 600s. Phase 8 sample uses 300s for demo录屏.
                format: int32
                minimum: 0
                type: integer
              metric:
                description: Metric describes how scaling decisions are computed.
                properties:
                  busyThreshold:
                    description: |-
                      BusyThreshold is the metric value (0-100) above which the scaler
                      switches to busyTemplateName.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  idleThreshold:
                    description: |-
                      IdleThreshold is the metric value (0-100) below which the scaler
                      switches to idleTemplateName.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  prometheusQuery:
                    description: |-
                      PrometheusQuery is the custom PromQL expression used when
                      Type=PrometheusQuery. The ingestor passes the expression verbatim
                      to the Prometheus /api/v1/query endpoint and expects a single-vector
                      result (windowed average is the operator's responsibility — the
                      expression should already encode `avg_over_time(... [window])` if
                      desired). MUST be non-empty when Type=PrometheusQuery; ignored when
                      Type=NPUUtilization.

                      Per ADR-0012 §7 + P9-T-007: namespace + model_service label injection
                      is the operator's responsibility (the controller does NOT mutate the
                      expression). NPUUtilization path remains the hardcoded
                      `avg_over_time(ascend_npu_utilization_percent{namespace,model_service}[window])`
                      wired by PrometheusIngestor.Query when CustomPromQL is empty.
                    type: string
                  type:
                    allOf:
                    - enum:
                      - NPUUtilization
                      - PrometheusQuery
                    - enum:
                      - NPUUtilization
                      - PrometheusQuery
                    default: NPUUtilization
                    description: |-
                      Type selects the metric backend. Phase 8 shipped only NPUUtilization;
                      Phase 9 P9-T-007 adds PrometheusQuery per ADR-0012 §7 forward note.
                    type: string
                  windowSeconds:
                    default: 300
                    description: |-
                      WindowSeconds is the sliding-window length for averaging the metric.
                      Default 300s; minimum 30s.
                    format: int32
                    minimum: 30
                    type: integer
                required:
                - busyThreshold
                - idleThreshold
                type: object
              scaleSlice:
                description: ScaleSlice maps busy/idle states to NPUSliceTemplate
                  refs.
                properties:
                  busyTemplateName:
                    description: |-
                      BusyTemplateName references an NPUSliceTemplate (cluster-scoped,
                      ADR-0011 §4) used when metric is above busyThreshold.
                    type: string
                  idleTemplateName:
                    description: |-
                      IdleTemplateName references an NPUSliceTemplate used when metric is
                      below idleThreshold.
                    type: string
                required:
                - busyTemplateName
                - idleTemplateName
                type: object
              target:
                description: Target is the ModelService this scaler manages.
                properties:
                  apiVersion:
                    default: inference.ocloud.edge.example.com/v1alpha1
                    description: APIVersion of the target object.
                    type: string
                  kind:
                    default: ModelService
                    description: Kind of the target object.
                    enum:
                    - ModelService
                    type: string
                  name:
                    description: Name of the target object.
                    type: string
                  namespace:
                    description: |-
                      Namespace of the target object. Phase 8 requires it to match the
                      scaler's own namespace (single-tenant scope per ADR-0012 §2).
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - metric
            - scaleSlice
            - target
            type: object
          status:
            description: NPUVerticalScalerStatus tracks observed state + scaling history.
            properties:
              conditions:
                description: Conditions tracks Active / ScalingInProgress / CooldownActive
                  lifecycle.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScaleTime:
                description: |-
                  LastScaleTime is the timestamp of the most recent scaling event;
                  used by the cooldown gate.
                format: date-time
                type: string
              observedTarget:
                description: |-
                  ObservedTarget records the last observed state of the target
                  ModelService (mainly currentTemplate for the printer column).
                properties:
                  currentTemplate:
                    description: |-
                      CurrentTemplate is the value of target.spec.template.sliceTemplate
                      as last observed by the scaler. Surfaced as the CurrentTemplate
                      printer column for at-a-glance state.
                    type: string
                  name:
                    description: Name of the observed ModelService (echoes spec.target.name).
                    type: string
                  namespace:
                    description: Namespace of the observed ModelService (echoes spec.target.namespace).
                    type: string
                required:
                - name
                - namespace
                type: object
              scaleHistory:
                description: |-
                  ScaleHistory is a rolling window of recent scaling events (oldest
                  first, max 10 entries; FIFO eviction).
                items:
                  description: ScaleEvent records one scaling transition for audit
                    + UI surfacing.
                  properties:
                    fromTemplate:
                      description: |-
                        FromTemplate is the sliceTemplate ref before the patch. May be empty
                        for the first observed scaling event (no prior template recorded).
                      type: string
                    reason:
                      description: |-
                        Reason is a human-readable explanation
                        (e.g. "metric 87 > busyThreshold 75").
                      type: string
                    time:
                      description: Time of the scaling event.
                      format: date-time
                      type: string
                    toTemplate:
                      description: ToTemplate is the sliceTemplate ref after the patch.
                      type: string
                  required:
                  - reason
                  - time
                  - toTemplate
                  type: object
                maxItems: 10
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
