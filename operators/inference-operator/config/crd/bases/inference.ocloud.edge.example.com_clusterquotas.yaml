---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterquotas.inference.ocloud.edge.example.com
spec:
  group: inference.ocloud.edge.example.com
  names:
    kind: ClusterQuota
    listKind: ClusterQuotaList
    plural: clusterquotas
    shortNames:
    - cq
    singular: clusterquota
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.enforcement.maxSliceAllocations
      name: MaxSliceAllocations
      type: integer
    - jsonPath: .status.usage.total.currentSliceAllocations
      name: CurrentTotal
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterQuota is the cluster-scope NPU-aware resource quota CRD per
          ADR-0014 §7 Forward notes line 1 + ADR-0018 §2 Decision D
          (Phase 11 P11-T-104).

          While namespace-scope Quota CRs(per existing quota_types.go)cap
          per-namespace NPUSliceAllocation count + scale-event rate, ClusterQuota
          caps cluster-wide totals across all namespaces · enforces a single
          cluster-wide budget for NPU slice consumption · and aggregates usage
          cross-cluster via Karmada karmada-aggregated-apiserver lifted-informer
          pattern(per ADR-0018 §2 Decision D).

          Enforcement: admission webhooks(extended in P11-T-104)read
          Status.Usage.Total to make decisions. status.usage.perCluster map
          records member cluster contributions(populated by the Quota controller
          via Karmada aggregated client when O2DMS_KARMADA_AGGREGATED_ENABLED=true
          · per inventory/karmada_aggregated.go helper · P11-T-103 substrate).

          API group lives under `inference.ocloud.edge.example.com/v1alpha1`
          (same scheme as namespace-scope Quota).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterQuotaSpec mirrors namespace-scope QuotaSpec but at
              cluster scope.
            properties:
              enforcement:
                description: Enforcement carries the cluster-wide caps.
                properties:
                  maxNPUSliceTemplateRefs:
                    description: |-
                      MaxNPUSliceTemplateRefs is an optional whitelist of
                      NPUSliceTemplate names that NPUVerticalScaler.spec.scaleSlice.{busy,idle}TemplateName
                      may reference. Empty (default) allows any template.
                    items:
                      type: string
                    type: array
                  maxScaleEventsPerWindow:
                    description: |-
                      MaxScaleEventsPerWindow caps the rate of NPUVerticalScaler.spec
                      scaleSlice mutations (scale events) within a sliding window.
                      Count=0 (default) means unbounded.
                    properties:
                      count:
                        default: 0
                        description: |-
                          Count is the maximum number of scale events allowed within
                          WindowSeconds. 0 (default) means unbounded.
                        format: int32
                        minimum: 0
                        type: integer
                      windowSeconds:
                        default: 3600
                        description: WindowSeconds is the sliding-window length in
                          seconds.
                        format: int32
                        minimum: 60
                        type: integer
                    type: object
                  maxSliceAllocations:
                    default: 0
                    description: |-
                      MaxSliceAllocations is the namespace-wide cap on concurrent
                      NPUSliceAllocation objects. 0 (default) means unbounded.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
            required:
            - enforcement
            type: object
          status:
            description: ClusterQuotaStatus tracks the observed cluster + per-member
              usage.
            properties:
              conditions:
                description: |-
                  Conditions tracks Active / EnforcementOK / AggregationStale
                  (Phase 11+ added · indicates Karmada aggregated-apiserver
                  last-sync staleness)。
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is the timestamp the controller last refreshed
                  Usage.
                format: date-time
                type: string
              usage:
                description: Usage carries Total + per-cluster breakdowns.
                properties:
                  perCluster:
                    additionalProperties:
                      description: QuotaUsage records current namespace consumption
                        against the spec caps.
                      properties:
                        currentSliceAllocations:
                          description: |-
                            CurrentSliceAllocations is the count of NPUSliceAllocation objects
                            currently in the namespace.
                          format: int32
                          type: integer
                        scaleEventsInWindow:
                          description: |-
                            ScaleEventsInWindow is the count of NPUVerticalScaler scale events
                            observed across all NPUVerticalScalers in the namespace within the
                            most recent WindowSeconds.
                          format: int32
                          type: integer
                      required:
                      - currentSliceAllocations
                      - scaleEventsInWindow
                      type: object
                    description: |-
                      PerCluster records the per-member contribution. Keys are Karmada
                      cluster names(`member1`, `member2`, ...). Empty when single-cluster
                      mode(O2DMS_KARMADA_AGGREGATED_ENABLED=false).
                    type: object
                  total:
                    description: |-
                      Total is the sum across all member clusters(host + member1 +
                      member2 + ...). Compared against Spec.Enforcement.MaxSliceAllocations
                      by admission webhook decision.
                    properties:
                      currentSliceAllocations:
                        description: |-
                          CurrentSliceAllocations is the count of NPUSliceAllocation objects
                          currently in the namespace.
                        format: int32
                        type: integer
                      scaleEventsInWindow:
                        description: |-
                          ScaleEventsInWindow is the count of NPUVerticalScaler scale events
                          observed across all NPUVerticalScalers in the namespace within the
                          most recent WindowSeconds.
                        format: int32
                        type: integer
                    required:
                    - currentSliceAllocations
                    - scaleEventsInWindow
                    type: object
                required:
                - total
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
