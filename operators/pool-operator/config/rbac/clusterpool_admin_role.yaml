# This rule is not used by the project pool-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ims.ocloud.edge.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pool-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterpool-admin-role
rules:
- apiGroups:
  - ims.ocloud.edge.example.com
  resources:
  - clusterpools
  verbs:
  - '*'
- apiGroups:
  - ims.ocloud.edge.example.com
  resources:
  - clusterpools/status
  verbs:
  - get
