# This rule is not used by the project pool-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ims.ocloud.edge.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pool-operator
    app.kubernetes.io/managed-by: kustomize
  name: npuslicepool-editor-role
rules:
- apiGroups:
  - ims.ocloud.edge.example.com
  resources:
  - npuslicepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ims.ocloud.edge.example.com
  resources:
  - npuslicepools/status
  verbs:
  - get
