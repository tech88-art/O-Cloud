  name: npuslicepools.ims.ocloud.edge.example.com
spec:
  group: ims.ocloud.edge.example.com
  names:
    kind: NPUSlicePool
    listKind: NPUSlicePoolList
    plural: npuslicepools
    shortNames:
    - nsp
    singular: npuslicepool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.strategy
      name: Strategy
      type: string
    - jsonPath: .status.totalSlices
      name: Total
      type: integer
    - jsonPath: .status.allocatedSlices
