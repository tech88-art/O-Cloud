                  - aiCoreCount
                  - id
                  - memoryMiB
                  - npuDeviceId
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              totalSlices:
                description: TotalSlices is the number of slice instances materialised
                  in this pool.
                format: int32
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
