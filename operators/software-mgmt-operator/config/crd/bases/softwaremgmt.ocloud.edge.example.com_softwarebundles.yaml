---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: softwarebundles.softwaremgmt.ocloud.edge.example.com
spec:
  group: softwaremgmt.ocloud.edge.example.com
  names:
    kind: SoftwareBundle
    listKind: SoftwareBundleList
    plural: softwarebundles
    shortNames:
    - swbundle
    singular: softwarebundle
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.rolloutPolicy.strategy
      name: RolloutPolicy
      type: string
    - jsonPath: .status.appliedNodeCount
      name: AppliedNodes
      type: integer
    - jsonPath: .status.targetNodeCount
      name: TargetNodes
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SoftwareBundle is the software-mgmt-operator CRD per ADR-0003 v2
          (P9-T-IMS-2 · Phase 9 P9-T-105 scaffold). Models node-level software
          version inventory + rollout policy per StarlingX sw-deployment pattern.

          Phase 9 P9-T-105: api types only · controller body Phase 10.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SoftwareBundleSpec describes the desired software state.
            properties:
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector limits the bundle to a subset of nodes (optional ·
                  empty means all nodes).
                type: object
              patches:
                description: |-
                  Patches is the ordered list of software patches in this bundle.
                  Each patch carries a name + source URI + checksum for verification.
                items:
                  description: SoftwarePatch describes one patch in the bundle.
                  properties:
                    checksum:
                      description: Checksum is the SHA-256 hex digest of the patch
                        artifact.
                      type: string
                    name:
                      description: Name identifies the patch within the bundle (must
                        be unique).
                      type: string
                    sourceURI:
                      description: SourceURI is the patch artifact location (oci://
                        · http:// · file://).
                      type: string
                  required:
                  - checksum
                  - name
                  - sourceURI
                  type: object
                type: array
              rolloutPolicy:
                description: RolloutPolicy controls how patches are applied across
                  nodes.
                properties:
                  maxUnavailable:
                    default: 1
                    description: |-
                      MaxUnavailable is the maximum number of nodes that can be in the
                      middle of applying patches simultaneously (RollingUpdate only).
                    format: int32
                    minimum: 1
                    type: integer
                  strategy:
                    allOf:
                    - enum:
                      - RollingUpdate
                      - Parallel
                      - Sequential
                    - enum:
                      - RollingUpdate
                      - Parallel
                      - Sequential
                    default: RollingUpdate
                    description: 'Strategy enum: RollingUpdate / Parallel / Sequential.'
                    type: string
                type: object
              version:
                description: Version is the human-readable bundle version (e.g. "v1.2.0").
                type: string
            required:
            - patches
            - rolloutPolicy
            - version
            type: object
          status:
            description: SoftwareBundleStatus carries the observed rollout state.
            properties:
              appliedNodeCount:
                description: AppliedNodeCount is the number of nodes that have completed
                  rollout.
                format: int32
                type: integer
              appliedVersion:
                description: |-
                  AppliedVersion is the version successfully applied across nodes.
                  Empty when no nodes have completed rollout yet.
                type: string
              conditions:
                description: Conditions tracks Active / Progressing / Completed /
                  Failed lifecycle.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failedNodeCount:
                description: FailedNodeCount is the number of nodes that failed rollout.
                format: int32
                type: integer
              targetNodeCount:
                description: |-
                  TargetNodeCount is the number of nodes matching spec.nodeSelector
                  (or all nodes if no selector).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
