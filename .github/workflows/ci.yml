# GitHub Actions CI for O-Cloud Edge Cloud Platform
#
# Filled by P1-T-007. Spec source: deploy/CLAUDE.md §3.1.
#
# Job map (all required for ci-pass except e2e):
#   detect-changes          dorny/paths-filter — gates other jobs by touched paths
#   check-allowed-paths     scripts/ci/check-allowed-paths.sh — enforce per-task whitelist
#   backend                 matrix [lint, test, build] over backend/
#   frontend                matrix [lint, test, build] + gen:types drift over frontend/
#   operators               make generate + manifests + diff check + offline validate-crds
#   validate-contract       swagger-cli + redocly build-docs
#   validate-mockdata       ajv compile + per-set validate (draft 2020-12, strict=false)
#   e2e                     stub; W2 task P1-T-110 fills (gated to push:dev)
#   ci-pass                 aggregator — all required jobs must succeed

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  # =========================================
  # 路径变更检测
  # =========================================
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      operators: ${{ steps.filter.outputs.operators }}
      configs: ${{ steps.filter.outputs.configs }}
      deploy: ${{ steps.filter.outputs.deploy }}
      contract: ${{ steps.filter.outputs.contract }}
      mockdata: ${{ steps.filter.outputs.mockdata }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            operators:
              - 'operators/**'
            configs:
              - 'configs/**'
            deploy:
              - 'deploy/**'
              - '.github/**'
              - 'scripts/**'
              - 'hack/**'
            contract:
              - 'docs/api-contract.yaml'
            mockdata:
              - 'configs/mock-data/**'

  # =========================================
  # Allowed Paths 校验
  # =========================================
  check-allowed-paths:
    name: Check Allowed Paths
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run check-allowed-paths
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          chmod +x scripts/ci/check-allowed-paths.sh
          ./scripts/ci/check-allowed-paths.sh

  # =========================================
  # 契约校验
  # =========================================
  validate-contract:
    name: Validate OpenAPI Contract
    needs: detect-changes
    if: needs.detect-changes.outputs.contract == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: swagger-cli validate
        run: npx -y -p @apidevtools/swagger-cli@4 swagger-cli validate docs/api-contract.yaml
      - name: redocly build-docs
        run: |
          # build-docs lints + bundles the OpenAPI into HTML; any unresolved $ref or
          # severe lint rule violation will fail the build. Output is discarded.
          npx -y @redocly/cli@latest build-docs docs/api-contract.yaml --output /tmp/api-contract.html
          test -s /tmp/api-contract.html && echo "build-docs OK"

  # =========================================
  # Mock 数据 schema 校验
  # =========================================
  validate-mockdata:
    name: Validate Mock Data Schema
    needs: detect-changes
    if: needs.detect-changes.outputs.mockdata == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile schema
        # First ensure the schema itself is valid (catches typos in $defs etc.)
        run: |
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile \
            --spec=draft2020 --strict=false \
            -s configs/mock-data/schema.json
      - name: Validate each set-*/ directory
        run: |
          set -euo pipefail
          shopt -s nullglob
          sets=(configs/mock-data/set-*/)
          if [[ ${#sets[@]} -eq 0 ]]; then
            echo "No mock datasets present; nothing to validate."
            exit 0
          fi
          for d in "${sets[@]}"; do
            echo "::group::Validating $d"
            npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate \
              --spec=draft2020 --strict=false \
              -s configs/mock-data/schema.json \
              -d "${d}*.json"
            echo "::endgroup::"
          done

  # =========================================
  # Backend
  # =========================================
  backend:
    name: Backend (${{ matrix.task }})
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # P5-T-108 (CI fix · 2026-05-19): pin to the module's own go.mod
          # so the toolchain matches backend/go.mod (currently 1.26.3) +
          # follows future bumps automatically. The previous fixed `1.22`
          # broke `make lint` which `go install`s golangci-lint v2 latest
          # (needs Go ≥ 1.24) and broke compilation against the module
          # graph (which requires Go ≥ 1.26).
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: make ${{ matrix.task }}
        working-directory: backend
        run: make ${{ matrix.task }}

  # =========================================
  # Frontend
  # =========================================
  frontend:
    name: Frontend (${{ matrix.task }})
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: gen:types drift check
        # Regenerate TS types from docs/api-contract.yaml and assert the committed
        # frontend/src/services/types.ts is in sync. If this fails, the contract
        # changed but the generated file wasn't re-committed.
        working-directory: frontend
        run: |
          pnpm run gen:types
          if ! git diff --quiet -- src/services/types.ts; then
            echo "::error::frontend/src/services/types.ts is out of sync with docs/api-contract.yaml. Run 'pnpm run gen:types' and commit."
            git --no-pager diff -- src/services/types.ts | head -50
            exit 1
          fi
          echo "types.ts in sync with contract."
      - name: Run ${{ matrix.task }}
        working-directory: frontend
        run: |
          case "${{ matrix.task }}" in
            lint)  pnpm run lint && pnpm run typecheck ;;
            test)  pnpm run test ;;
            build) pnpm run build ;;
            *) echo "unknown task: ${{ matrix.task }}"; exit 2 ;;
          esac

  # =========================================
  # Operators
  # =========================================
  operators:
    name: Operators
    needs: detect-changes
    if: needs.detect-changes.outputs.operators == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # P5-T-108 (CI fix · 2026-05-19): pin to pool-operator's own
          # go.mod (currently 1.25.7) so the toolchain matches the
          # module + can `go install` controller-tools@v0.20.1 (which
          # requires Go ≥ 1.24). The previous fixed `1.22` broke
          # `make generate` / `make manifests`.
          go-version-file: operators/pool-operator/go.mod
          cache-dependency-path: operators/pool-operator/go.sum
      - name: make generate + manifests
        working-directory: operators/pool-operator
        run: |
          make generate
          make manifests
      - name: Verify generated artifacts committed
        # If `make generate` or `make manifests` produced changes, the committed
        # CRD YAML / deepcopy files are stale. The PR must include them.
        working-directory: operators/pool-operator
        run: |
          if ! git diff --quiet; then
            echo "::error::operators/pool-operator has uncommitted output from 'make generate'/'make manifests'."
            git --no-pager diff | head -100
            exit 1
          fi
          echo "Generated artifacts match committed state."
      - name: Offline CRD validation (Phase 1)
        # Phase 1 stand-in for `kubectl apply --dry-run=server`. See
        # operators/pool-operator/hack/validate-crds/main.go for rationale.
        # Skips `make test` (which needs envtest binaries + a live API server);
        # Phase 3+ enables envtest in this job.
        working-directory: operators/pool-operator
        run: go run ./hack/validate-crds ./config/crd/bases

  # =========================================
  # IMS 3 scaffold modules (Phase 9 P9-T-105 · per ADR-0003 v2 + CLAUDE.md §14.2)
  # =========================================
  ims-scaffold:
    name: IMS 3 scaffold modules
    needs: detect-changes
    if: needs.detect-changes.outputs.operators == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        module:
          - node-lifecycle-operator
          - software-mgmt-operator
          - bare-metal-provisioning-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operators/${{ matrix.module }}/go.mod
          cache-dependency-path: operators/${{ matrix.module }}/go.sum
      - name: go build + test (api types only · scaffold)
        working-directory: operators/${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1 -timeout 120s

  # =========================================
  # O2 DMS Adapter (Phase 9 P9-T-008 scaffold · new module)
  # =========================================
  o2-dms-adapter:
    name: O2 DMS Adapter
    needs: detect-changes
    if: needs.detect-changes.outputs.operators == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # P9-T-008 (2026-05-21): o2-dms-adapter is a fresh module on Go
          # 1.26.3 (matches backend/go.mod · the highest in workspace).
          go-version-file: operators/o2-dms-adapter/go.mod
          cache-dependency-path: operators/o2-dms-adapter/go.sum
      - name: go build + vet
        working-directory: operators/o2-dms-adapter
        run: |
          go build ./...
          go vet ./...
      - name: go test (stub-routing + 404 cases)
        working-directory: operators/o2-dms-adapter
        run: go test ./... -count=1 -timeout 120s -v
      - name: helm lint --strict
        run: helm lint --strict deploy/helm-charts/o2-dms-adapter
      - name: helm template (renders 5 resources)
        run: |
          helm template test deploy/helm-charts/o2-dms-adapter \
            | grep -E "^kind: " | sort | uniq -c

  # =========================================
  # E2E (W2 起启用 — 由 P1-T-110 实现)
  # =========================================
  e2e:
    name: E2E
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    continue-on-error: true  # 允许失败但开 issue
    steps:
      - uses: actions/checkout@v4
      # TODO(P1-T-110, P1-T-305): replace with real Playwright suite
      - name: Run E2E (stub)
        run: |
          echo "::warning::E2E suite not yet implemented — placeholder for P1-T-110 / P1-T-305"
          exit 0

  # =========================================
  # 最终汇总
  # =========================================
  ci-pass:
    name: CI Pass
    if: always()
    needs:
      - check-allowed-paths
      - validate-contract
      - validate-mockdata
      - backend
      - frontend
      - operators
      - ims-scaffold
      - o2-dms-adapter
    runs-on: ubuntu-22.04
    steps:
      - name: Check status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::有必须 job 失败"
            exit 1
          fi
          echo "CI Passed"
