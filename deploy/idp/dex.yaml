---
# =============================================================================
# Dex — REFERENCE OIDC Identity Provider for O-Cloud (P13-T-202 · ADR-0025 §2
# Decision A · §3 right-sizing · §4(a) swap point).
#
# THIS IS A REFERENCE IMPLEMENTATION, NOT A PRODUCTION IdP. It exists so the
# real-profile OIDC auth path (o2-dms OIDCValidator · P13-T-201) has a working
# issuer to validate tokens against, end-to-end, without a customer IdP. The
# customer replaces Dex with their own IdP (Keycloak / Entra ID / Okta / ...)
# by re-pointing issuerURL + audiences — see deploy/idp/README.md.
#
# Right-sized per ADR-0025 §3 (reference-grade, NOT gold-plated):
#   - single replica (replicas: 1) · NO HA, NO leader-election;
#   - in-memory storage (NO CRDs, NO database, NO RBAC on dex.coreos.com) —
#     a single-replica reference does not need persistent client/token store;
#   - in-cluster issuer (ClusterIP Service · no Ingress / external TLS / cert
#     federation) — a customer IdP brings its own ingress + TLS;
#   - two static OIDC clients (o2-dms, ocloud-backend) + one static demo user.
#
# Apply (reference; customer swaps the whole dir):
#   kubectl apply -n ocloud-system -f deploy/idp/dex.yaml
# (the namespace ocloud-system is created by the core install; this manifest
#  does NOT create it, to stay composable with scripts/install.sh.)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: ocloud-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: idp
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
automountServiceAccountToken: false
---
# Dex configuration. With in-memory storage Dex needs NO Kubernetes RBAC at
# all (it never talks to the apiserver) — the ServiceAccount above is plain
# (no Role/ClusterRole bound). Static clients + connectors are declared here.
#
# issuer MUST exactly equal the URL clients dial AND the `iss` claim Dex
# stamps into tokens — the o2-dms OIDCValidator (O2DMS_OIDC_ISSUER) discovers
# <issuer>/.well-known/openid-configuration, so this string is the single
# source of truth for the in-cluster issuer convention:
#   http://dex.ocloud-system.svc.cluster.local:5556/dex
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: ocloud-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: idp
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
data:
  config.yaml: |
    # In-cluster issuer URL (the swap point — see README §"Swapping in your
    # own IdP"). Path-prefixed `/dex` is Dex convention; keep it consistent
    # with the Service port (5556) + deploy/profiles/real/*.values.yaml.
    issuer: http://dex.ocloud-system.svc.cluster.local:5556/dex

    # In-memory storage — reference-grade single replica (ADR-0025 §3).
    # Tokens/auth-codes live in process memory; a restart drops in-flight
    # sessions (acceptable for a reference; a customer IdP persists its own).
    storage:
      type: memory

    web:
      http: 0.0.0.0:5556

    # Telemetry endpoint (health/readiness probes hit /healthz here).
    telemetry:
      http: 0.0.0.0:5558

    # OAuth2 niceties for headless / device-style flows used by service
    # clients (reference; tighten per customer policy).
    oauth2:
      skipApprovalScreen: true

    # ---- STATIC OIDC CLIENTS ----------------------------------------------
    # Each client ID is the OIDC `aud` (audience) a token minted FOR that
    # client carries. o2-dms enforces O2DMS_OIDC_AUDIENCE == "o2-dms";
    # the backend (if it ever validates user tokens) would enforce
    # "ocloud-backend". Client secrets are reference placeholders, injected
    # from the Secret below via $DEX_* env expansion (Dex expands ${VAR}).
    # CUSTOMER SWAP: replace these with your IdP's client registrations.
    staticClients:
      - id: o2-dms
        name: O-Cloud O2 DMS Adapter
        secretEnv: DEX_O2DMS_CLIENT_SECRET
        # Service-to-service / CLI use: redirect URIs are reference defaults.
        redirectURIs:
          - http://localhost:8088/callback
      - id: ocloud-backend
        name: O-Cloud Demo Backend
        secretEnv: DEX_BACKEND_CLIENT_SECRET
        redirectURIs:
          - http://localhost:8080/callback

    # ---- STATIC CONNECTOR (reference demo user) ----------------------------
    # enablePasswordDB + a single static password lets the reference IdP mint
    # real tokens end-to-end (T301 lab) without an external upstream. The
    # bcrypt hash below is for the reference password "password" — DEMO ONLY.
    # CUSTOMER SWAP: disable enablePasswordDB and wire your real connector
    # (LDAP / SAML / OIDC upstream / etc.).
    enablePasswordDB: true
    staticPasswords:
      - email: admin@ocloud.local
        # bcrypt of "password" (reference only · NEVER a real credential).
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4i"
        username: admin
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
---
# Reference client secrets. DEMO PLACEHOLDERS — these are NOT real
# credentials. P13-T-203 (Vault / external-secrets) replaces this Secret with
# an ExternalSecret pointing at Vault; the customer's real IdP brings its own
# client-secret management. Kept inline here ONLY so the reference IdP is
# self-contained for offline render + T301 lab bring-up.
apiVersion: v1
kind: Secret
metadata:
  name: dex-client-secrets
  namespace: ocloud-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: idp
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
type: Opaque
stringData:
  # Reference placeholders — swap via Vault (T203) / customer IdP.
  o2dms-client-secret: "reference-o2dms-secret-DO-NOT-USE-IN-PROD"
  backend-client-secret: "reference-backend-secret-DO-NOT-USE-IN-PROD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: ocloud-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: idp
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
spec:
  # Single replica — reference IdP, no HA (ADR-0025 §3). In-memory storage
  # is NOT shareable across replicas anyway; scaling >1 would split sessions.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
      app.kubernetes.io/component: idp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: ocloud-edge
        app.kubernetes.io/component: idp
        app.kubernetes.io/managed-by: ocloud-reference
        ocloud.edge.example.com/reference-only: "true"
    spec:
      serviceAccountName: dex
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # ADR-0020: deploy target = aarch64 鲲鹏 + 昇腾 910B. Prefer arm64
      # (soft · non-required) so amd64 dev/CI still schedules. The upstream
      # ghcr.io/dexidp/dex image is multi-arch (amd64 + arm64).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
      containers:
        - name: dex
          # Pinned reference version. dexidp/dex v2.41.1 (multi-arch).
          # CUSTOMER SWAP: the customer brings their own IdP; this image is
          # only the reference issuer.
          image: ghcr.io/dexidp/dex:v2.41.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
              protocol: TCP
            - name: telemetry
              containerPort: 5558
              protocol: TCP
          env:
            # Client secrets expanded into the static-client config via
            # secretEnv (Dex expands ${DEX_*}).
            - name: DEX_O2DMS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-client-secrets
                  key: o2dms-client-secret
            - name: DEX_BACKEND_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-client-secrets
                  key: backend-client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: ocloud-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: idp
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
spec:
  # ClusterIP — in-cluster issuer only (ADR-0025 §3). A customer IdP fronts
  # itself with its own ingress + TLS; this reference stays cluster-internal.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dex
    app.kubernetes.io/component: idp
  ports:
    - name: http
      port: 5556
      targetPort: http
      protocol: TCP
    - name: telemetry
      port: 5558
      targetPort: telemetry
      protocol: TCP
