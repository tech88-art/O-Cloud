# Real edition — demo-backend helm values.
# 物理数据版:大部分资源接 in-cluster K8s / Pool CRD / Prometheus / ConfigMap。
# 选择:helm upgrade --install demo-backend deploy/helm-charts/demo-backend \
#         -n ocloud-system -f deploy/profiles/real/demo-backend.values.yaml
#
# ✅ Phase-13 P13-T-103:mapping.topology 已切 k8s 真源(ResourceSlice
#    hccs_ring/numa_node 聚合 · ADR-0024 §2 Decision C)→ topology 不再需要
#    mock-data。⚠️ 仅 mapping.deploy 仍 = mock(真 Deploy() 体待 P13-T-104),
#    deploy 不消费 mock-data fixtures(preset 走 configmap 真源)→ 真集群部署
#    已不再依赖 mock-data ConfigMap(原「mock-data 缺口」随 topology 转真源消解)。

replicaCount: 2            # 真版 HA(leader + standby)
leaseElection:
  enabled: true
serviceMonitor:
  enabled: true            # 接 kube-prometheus-stack
podLabels:
  ocloud.edge.example.com/edition: real

# 物理数据源 mapping(= backend/configs/config.real.yaml,内联给 chart 挂载)。
config:
  yaml: |
    server:
      port: 8080
      enableCORS: false
    logging:
      level: info
    datasources:
      mock:                      # 仅给 deploy(真 Deploy() 体待 P13-T-104)
        enabled: true
        path: /etc/demo-backend/mock-data   # deploy 不读 fixtures;topology 已切 k8s
      k8s:
        enabled: true
        kubeconfig: ""           # in-cluster ServiceAccount
      crd:
        enabled: true
        kubeconfig: ""
      prometheus:
        enabled: true
        url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
      configmap:
        enabled: true
        kubeconfig: ""
        path: "ocloud-system/ocloud-presets"
    mapping:
      clusters: k8s
      topology: k8s            # P13-T-103: 真拓扑(ResourceSlice hccs_ring/numa_node) · 备选 crd
      nodes: k8s
      npus: k8s
      pools: crd
      workloads: k8s
      metrics: prometheus
      presets: configmap
      deploy: mock             # PHASE-13: 无真 Deploy() 体(P13-T-104)
      logs: k8s
    cache:
      defaults:
        max_entries: 1024
        ttl: 5m
      per_resource:
        topology: { max_entries: 64, ttl: 30s }
        workloads: { max_entries: 256, ttl: 1m }
