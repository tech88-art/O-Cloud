# Real edition — demo-backend helm values.
# 物理数据版:大部分资源接 in-cluster K8s / Pool CRD / Prometheus / ConfigMap。
# 选择:helm upgrade --install demo-backend deploy/helm-charts/demo-backend \
#         -n ocloud-system -f deploy/profiles/real/demo-backend.values.yaml
#
# ✅ Phase-13 P13-T-103:mapping.topology 已切 k8s 真源(ResourceSlice
#    hccs_ring/numa_node 聚合 · ADR-0024 §2 Decision C)→ topology 不再需要 mock-data。
# ✅ Phase-13 P13-T-104:mapping.deploy 已切 k8s 真源(client-go apply / delete
#    Deployment+Service · ADR-0024 §2 Decision E)→ 全部资源接真源,无 mock 引用,
#    真集群部署已不再依赖 mock-data ConfigMap。
#
# ✅ Phase-13 P13-T-202:RBAC carry CLOSED(base chart `templates/rbac.yaml` 加了
#    gated 的 cluster-read + deploy-write RBAC · ADR-0025 §2 Decision A 最小权限)。
#    本 profile 下面 `rbac:` 块翻开两个开关:
#      - clusterRead → P13-T-103 真拓扑(resource.k8s.io resourceslices + nodes
#        READ-ONLY · cluster-scoped ClusterRole)。缺它则 HCCS overlay 静默退化到
#        静态布局(非 fatal · 见 phase-13-t103.md)。
#      - deployWrite → P13-T-104 真 Deploy()/DeleteDeploy()(apps deployments +
#        core services create/delete/list/get/update/patch · namespaced Role in
#        release ns)。缺它则真 POST /api/v1/deploy 被 apiserver 403。
#    无 wildcard · verb 精确到 client-go 路径实际所需(deploy.go)。

replicaCount: 2            # 真版 HA(leader + standby)
leaseElection:
  enabled: true
serviceMonitor:
  enabled: true            # 接 kube-prometheus-stack
podLabels:
  ocloud.edge.example.com/edition: real

# P13-T-202:真数据源 RBAC(demo 版默认全 false · 真版按需翻开 · 最小权限)。
rbac:
  clusterRead: true        # P13-T-103: ResourceSlice(hccs_ring/numa_node)+ nodes READ
  deployWrite: true        # P13-T-104: Deployment+Service 写(真 Deploy/DeleteDeploy)
  # workloadNamespace 留空 = release namespace(backend 与 workload 同 ns 部署)。
  # 若 workload 要落到专用 ns,在此填该 ns(deploy Role 会建在那里)。
  workloadNamespace: ""

# 物理数据源 mapping(= backend/configs/config.real.yaml,内联给 chart 挂载)。
config:
  yaml: |
    server:
      port: 8080
      enableCORS: false
    logging:
      level: info
    datasources:
      mock:                      # 已无 mapping 引用(deploy 也切 k8s · P13-T-104);保留仅作应急回退
        enabled: true
        path: /etc/demo-backend/mock-data
      k8s:
        enabled: true
        kubeconfig: ""           # in-cluster ServiceAccount
      crd:
        enabled: true
        kubeconfig: ""
      prometheus:
        enabled: true
        url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
      configmap:
        enabled: true
        kubeconfig: ""
        path: "ocloud-system/ocloud-presets"
    mapping:
      clusters: k8s
      topology: k8s            # P13-T-103: 真拓扑(ResourceSlice hccs_ring/numa_node) · 备选 crd
      nodes: k8s
      npus: k8s
      pools: crd
      workloads: k8s
      metrics: prometheus
      presets: configmap
      deploy: k8s              # P13-T-104: 真 Deploy()/DeleteDeploy()(apply Deployment+Service) · ADR-0024 §2 Decision E
      logs: k8s
    cache:
      defaults:
        max_entries: 1024
        ttl: 5m
      per_resource:
        topology: { max_entries: 64, ttl: 30s }
        workloads: { max_entries: 256, ttl: 1m }
