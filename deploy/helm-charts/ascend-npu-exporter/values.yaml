# Default values for ascend-npu-exporter.
#
# Phase 2 sticks with the official community image; exporter-plus
# (Phase 3+) will swap `image.repository` to the in-house build.

image:
  # Huawei publishes the exporter via SWR; mirror locally for air-gapped
  # demos by overriding `image.repository`.
  repository: swr.cn-south-1.myhuaweicloud.com/ascendhub/ascend-npu-exporter
  tag: v6.0.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Where the exporter serves its /metrics endpoint inside the container.
# Defaults match the upstream binary (see README §Usage).
exporter:
  port: 8082
  # Polling interval to query npu-smi; bigger = lower CPU at the cost of
  # staler dashboards.
  scrapeIntervalSeconds: 15
  # Maximum log verbosity (-v=0 silent, -v=5 trace).
  logLevel: 1

# DaemonSet runs one exporter per Ascend node. Use a node selector that
# matches the device-plugin's label so we don't schedule onto plain CPU
# nodes (where /dev/davinci* doesn't exist).
nodeSelector:
  huawei.com/Ascend910B: "true"

tolerations:
  - key: huawei.com/Ascend910B
    operator: Exists
    effect: NoSchedule

# RBAC — exporter reads Node + Pod for cross-reference labels.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Mount the host's /dev so the exporter can talk to NPU devices, and
# /run/ascend so it can read the device-plugin's heartbeat socket.
hostMounts:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# A ClusterIP Service is enough — ServiceMonitor selects on it.
service:
  type: ClusterIP
  port: 8082
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"

# ServiceMonitor (kube-prometheus-stack). Disable when the cluster has
# no Prometheus Operator installed.
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
  # Drop high-cardinality labels the dashboards don't need.
  metricRelabelings: []

# Pod-level securityContext. /dev access requires privileged true on
# Ascend reference hosts; tighten if the cluster supports user-namespace
# mapping.
podSecurityContext: {}
securityContext:
  privileged: true
  capabilities:
    drop:
      - ALL
    add:
      - SYS_ADMIN
