apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ascend-npu-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ascend-npu-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ascend-npu-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ascend-npu-exporter.selectorLabels" . | nindent 8 }}
      annotations:
        # Force a rolling restart when values.yaml changes meaningfully.
        checksum/values: {{ .Values | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ include "ascend-npu-exporter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: false
      hostPID: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port={{ .Values.exporter.port }}
            - --updateTime={{ .Values.exporter.scrapeIntervalSeconds }}
            - -v={{ .Values.exporter.logLevel }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.hostMounts.enabled }}
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: run-ascend
              mountPath: /run/ascend
              readOnly: true
            - name: var-log
              mountPath: /var/log/mindx-dl
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
      {{- if .Values.hostMounts.enabled }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: run-ascend
          hostPath:
            path: /run/ascend
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log/mindx-dl
            type: DirectoryOrCreate
      {{- end }}
