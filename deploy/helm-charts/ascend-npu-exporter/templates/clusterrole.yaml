{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ascend-npu-exporter.fullname" . }}
  labels:
    {{- include "ascend-npu-exporter.labels" . | nindent 4 }}
rules:
  # Node — pull `huawei.com/Ascend910B` capacity + Ready conditions so
  # the exporter can label series with node/role.
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
  # Pod — cross-reference NPU device requests so per-workload utilisation
  # can be exposed as `npu_pod_*` series.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # ConfigMaps — exporter reads the device-plugin's runtime config (HCCS
  # topology overrides etc.) from `kube-system/ascend-device-plugin-config`.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
{{- end -}}
