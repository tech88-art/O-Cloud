---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: baremetalnodes.provisioning.ocloud.edge.example.com
spec:
  group: provisioning.ocloud.edge.example.com
  names:
    kind: BareMetalNode
    listKind: BareMetalNodeList
    plural: baremetalnodes
    shortNames:
    - bmnode
    singular: baremetalnode
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.provisioningState
      name: State
      type: string
    - jsonPath: .status.macAddress
      name: MAC
      type: string
    - jsonPath: .spec.bmc.address
      name: BMCAddress
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BareMetalNode is the bare-metal-provisioning-operator CRD per
          ADR-0003 v2 (P9-T-IMS-3 · Phase 9 P9-T-105 scaffold). Models
          Metal3 / cluster-api BareMetalHost pattern adapted for O-Cloud
          edge context · bmc{address,credentials} + provisioning state machine.

          Phase 9 P9-T-105: api types only · controller body Phase 10.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BareMetalNodeSpec describes the BMC connection + desired
              provisioning.
            properties:
              bmc:
                description: BMC carries the Baseboard Management Controller endpoint
                  + creds.
                properties:
                  address:
                    description: |-
                      Address is the BMC endpoint (e.g. "ipmi://192.0.2.10" or
                      "redfish+https://bmc.example.com").
                    type: string
                  credentialsRef:
                    description: |-
                      CredentialsRef is the name of a Secret in the same namespace as
                      the BareMetalNode (cluster-scoped CRD references a namespaced
                      Secret · namespace defaults to operator's own).
                    properties:
                      name:
                        description: Name of the Secret containing keys "username"
                          + "password".
                        type: string
                      namespace:
                        default: ocloud-system
                        description: Namespace of the Secret.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - address
                - credentialsRef
                type: object
              desiredState:
                default: Inspecting
                description: |-
                  DesiredState is the provisioning state the operator should drive
                  the bare-metal node toward.
                enum:
                - Inspecting
                - Registering
                - Provisioning
                - Provisioned
                - Ready
                - Deprovisioning
                - Error
                type: string
              image:
                description: |-
                  Image is the OS image to provision (oci:// or http:// URI to
                  raw / qcow2 / iso).
                properties:
                  checksum:
                    description: Checksum is the SHA-256 hex digest of the image.
                    type: string
                  url:
                    description: URL is the image source URI.
                    type: string
                required:
                - url
                type: object
            required:
            - bmc
            type: object
          status:
            description: BareMetalNodeStatus carries the observed provisioning state.
            properties:
              conditions:
                description: Conditions tracks Ready / BMCReachable / ImagePulled
                  etc.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hardwareInfo:
                description: |-
                  HardwareInfo carries inspected hardware metadata (CPU count ·
                  memory bytes · NPU count etc.).
                properties:
                  cpuCount:
                    description: CPUCount is the number of CPU cores.
                    format: int32
                    type: integer
                  memoryBytes:
                    description: MemoryBytes is total RAM bytes.
                    format: int64
                    type: integer
                  npuCount:
                    description: NPUCount is the number of Ascend NPU devices.
                    format: int32
                    type: integer
                type: object
              lastTransitionTime:
                description: LastTransitionTime is when ProvisioningState last changed.
                format: date-time
                type: string
              macAddress:
                description: MACAddress is the MAC address discovered during BMC inspection.
                type: string
              provisioningState:
                description: ProvisioningState is the currently observed state.
                enum:
                - Inspecting
                - Registering
                - Provisioning
                - Provisioned
                - Ready
                - Deprovisioning
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
