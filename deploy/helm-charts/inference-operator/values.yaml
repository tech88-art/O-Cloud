# Default values for inference-operator (Phase 5 T006 skeleton).
#
# T006 ships the ModelServiceReconciler scaffold (resolve pool, drive
# phase Pending → Provisioning, manage finalizer). T007 + T008 expand
# Reconcile to create Deployments + ResourceClaims and walk the phase
# machine to Ready / Failed. T101 + T102 + T103 add the cert-manager
# wiring + PD Router webhook.

image:
  repository: inference-operator
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Node placement. Default: no constraint — Phase 5 controller has no
# real-hardware dependency.
nodeSelector: {}
tolerations: []
# ADR-0020 (P12-T-103): 部署 target = aarch64 鲲鹏 + 昇腾 910B. Soft node affinity
# 偏好 arm64(preferred · 非 required)→ 生产全 arm64 节点必匹配;amd64 dev/CI/kind
# 仍可调度(不破 render-verify / kind smoke).
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - arm64

# Pod-level securityContext mirrors npu-dra-driver chart (Phase 5 T101).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

healthProbeBindAddress: ":8081"
metricsBindAddress: ":8082"

# ----------------------------------------------------- ModelService controller
# T006 toggle. Default ON.
modelServiceController:
  enabled: true

# ------------------------------------------------- PD Router webhook (T102+)
# Toggles the PD Router mutating admission webhook. Default ON; flip to
# false to skip the webhook server entirely (also skips webhook K8s
# objects Service + MutatingWebhookConfiguration). failurePolicy=Fail
# per ADR-0008 — production phased-rollouts can override to Ignore
# while monitoring webhook health.
pdRouter:
  enabled: true
  failurePolicy: Fail
  timeoutSeconds: 5

# -------------------------------------------------- Quota multi-tenant admission (P9-T-006)
# Per ADR-0014 §2 Decision C + §5: TWO ValidatingAdmissionWebhooks on
# the same inference-operator binary (cert-manager reuse · port 9443).
#   Webhook A: NPUSliceAllocation CREATE  → maxSliceAllocations cap
#   Webhook B: NPUVerticalScaler UPDATE   → scale rate + template whitelist
# failurePolicy=Fail per ADR-0014 §5 security boundary rationale —
# webhook failure should NOT silently bypass namespace quota.
quota:
  enabled: true
  failurePolicy: Fail
  timeoutSeconds: 5

# -------------------------------------------------- cert-manager wiring (T101)
# When enabled, the chart renders a cert-manager Certificate + (optional)
# Issuer pointing at the PD Router webhook TLS secret. cert-manager (v1.16+)
# MUST be pre-installed in the cluster — this chart does NOT bundle it as a
# subchart dependency. See docs/known-issues.md #10 for install order.
certManager:
  enabled: true
  # Certificate validity + renewal window (cert-manager defaults: 8760h
  # and 720h respectively). Override for shorter rotation in CI.
  duration: 8760h
  renewBefore: 720h
  # Issuer configuration. Default: create a self-signed Issuer in the
  # release namespace (cluster operators with their own CA override
  # create=false + kind=ClusterIssuer + name=<their issuer>).
  issuer:
    create: true
    kind: Issuer
    name: ""

# ----------------------------------------------------- Metrics (P6-T-104)
# Three Prometheus collectors registered by the manager's
# internal/metrics package:
#   - inference_modelservice_phase_transitions_total{from,to}     Counter
#   - inference_pdrouter_decisions_total{decision}                Counter
#   - inference_modelservice_reconcile_duration_seconds            Histogram
#
# Served on the manager's metrics-bind-address (default :8082). A separate
# Service ($fullname-metrics) is rendered when metrics.enabled=true so
# Prometheus can scrape via in-cluster service routing. ServiceMonitor
# is opt-in via metrics.serviceMonitor.enabled (requires Prometheus
# Operator CRDs installed in the cluster).
metrics:
  enabled: true
  port: 8082
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Extra labels merged onto the ServiceMonitor's metadata.labels
    # (operators often need a `prometheus: kube-prometheus` selector
    # so kube-prometheus-stack picks the monitor up).
    labels: {}
    # Prometheus relabel_config[] verbatim. Pass-through.
    relabelings: []
  # ------------- Phase 8 NPUVerticalScaler busy-idle ingestor (P8-T-006)
  # The NPUVerticalScaler controller (P8-T-007) pulls
  # `ascend_npu_utilization_percent` from Prometheus via
  # internal/metrics.PrometheusIngestor. Per ADR-0012 §1 reconcile step 3
  # the ingestor folds connection / DNS / 5xx failures into NoData=true
  # so transient Prometheus outages do NOT flip the scaler ConditionActive=False.
  #
  # Leave prometheusURL empty for degraded mode (ingestor returns NoData
  # for every query; NPUVerticalScaler.Reconcile stays in current template
  # and requeues). Set to the in-cluster Prometheus URL to enable scaling
  # decisions.
  prometheusURL: ""
  # Per-query roundtrip timeout (Go duration string). Default 5s when
  # empty. ctx deadline takes precedence at call site.
  queryTimeout: "5s"
  # Reconcile-loop scrape cadence (informational; used by chart README +
  # docs/devlog). The NPUVerticalScaler controller actually drives
  # cadence via Reconcile.RequeueAfter (T007).
  scrapeIntervalSeconds: 30

# ----------------------------------------------------- Leader election
leaderElect: true

# ----------------------------------------------------- ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ----------------------------------------------------- RBAC
# Phase 5 T006 grants minimum required:
#   - modelservices            full CRUD (controller owns the kind)
#   - modelservices/status     update + patch
#   - modelservices/finalizers update + patch
#   - npusliceallocations      read (Phase 5 T103 webhook + T008 phase
#                              machine read this to compose slice-
#                              bindings annotation + aggregate Ready)
#   - resourceclaims           CRUD (T007 creates one per replica)
#   - npuslicepools            read (T006 resolves pool by reference)
#   - leases                   leader election
#   - events                   emit reconcile events
rbac:
  create: true

# ----------------------------------------------------- Defaults(Phase 11 P11-T-008)
# `defaults.proxyImage` is the operator-side global default for vLLM PD
# proxy sidecar image. Per-ModelService override wins(ms.Spec.PDPair.
# ProxyImage > chart default). Empty value → no DEFAULT_PROXY_IMAGE env
# injected · controller.DefaultProxyImage stays "" · per-CR field is
# the only source.
#
# Per ADR-0017 §2 Decision D 6th 优先级 + ADR-0010 known-issues #13
# 5-phase carry closer(P10-T-106 substrate + P11-T-008 env wire).
# `internal/controller/deployment_builder.go` EffectiveProxyImage()
# consume order: per-CR PDPair.ProxyImage → DefaultProxyImage(set from
# DEFAULT_PROXY_IMAGE env at cmd/main.go startup hook) → "" (no sidecar).
defaults:
  proxyImage: ""  # operators override: --set defaults.proxyImage=quay.io/vllm-project/vllm-ascend:v0.18.0

# ----------------------------------------------------- Extras
extraArgs: []
extraEnv: []
podAnnotations: {}
podLabels: {}
