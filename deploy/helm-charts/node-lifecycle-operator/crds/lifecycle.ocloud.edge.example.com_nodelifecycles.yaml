---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nodelifecycles.lifecycle.ocloud.edge.example.com
spec:
  group: lifecycle.ocloud.edge.example.com
  names:
    kind: NodeLifecycle
    listKind: NodeLifecycleList
    plural: nodelifecycles
    shortNames:
    - nodelc
    singular: nodelifecycle
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.nodeName
      name: NodeName
      type: string
    - jsonPath: .status.lastTransitionTime
      name: LastTransition
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeLifecycle is the node-lifecycle-operator CRD per ADR-0003 v2
          IMS 7 services phasing (P9-T-IMS-1 · Phase 9 P9-T-105 scaffold).
          References StarlingX node lifecycle state machine model · adapted for
          O-Cloud edge platform context (multi-site Karmada + edge KubeEdge nodes).

          Phase 9 P9-T-105: api types only · no controller body. Phase 10
          controller body + reconcile loops + helm chart land per ADR-0003 v2.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeLifecycleSpec describes the desired lifecycle state of
              a node.
            properties:
              desiredState:
                default: Unlocked
                description: |-
                  DesiredState is the lifecycle state the operator should drive
                  the node toward.
                enum:
                - Provisioning
                - Bootstrap
                - Available
                - DegradedAvailable
                - Unavailable
                - Locked
                - Unlocked
                - RebootRequired
                type: string
              maintenanceWindow:
                description: |-
                  MaintenanceWindow is an optional time window during which
                  disruptive transitions (RebootRequired / Locked) are permitted.
                properties:
                  durationSeconds:
                    description: DurationSeconds is the window length.
                    format: int32
                    minimum: 60
                    type: integer
                  start:
                    description: Start is the start timestamp.
                    format: date-time
                    type: string
                required:
                - durationSeconds
                - start
                type: object
              nodeName:
                description: |-
                  NodeName is the K8s `core/v1.Node.metadata.name` this lifecycle
                  object tracks. Cluster-scoped: 1 NodeLifecycle per cluster Node.
                type: string
            required:
            - nodeName
            type: object
          status:
            description: NodeLifecycleStatus carries the observed lifecycle state.
            properties:
              conditions:
                description: |-
                  Conditions tracks per-state condition events. Phase 9 scaffold:
                  5-7 condition types per ADR-0003 v2 scaffold acceptance.
                  Per-condition types defined by Phase 10 controller body when
                  reconcile loop lands. Common: Ready / DiskPressure /
                  NetworkUnavailable / RebootRequired / Maintenance / Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastTransitionTime:
                description: LastTransitionTime is when the state last changed.
                format: date-time
                type: string
              state:
                description: State is the currently observed state.
                enum:
                - Provisioning
                - Bootstrap
                - Available
                - DegradedAvailable
                - Unavailable
                - Locked
                - Unlocked
                - RebootRequired
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
