# Default values for node-lifecycle-operator chart (Phase 11 P11-T-004).
# Per ADR-0003 v2 IMS-1 + plan §3 P11-T-004 acceptance.

replicaCount: 1

image:
  repository: ghcr.io/tech88-art/o-cloud/node-lifecycle-operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Leader-election ID for the controller-runtime manager (per ADR-0017 §2
# Decision D 1st 优先级 demo-backend pattern · same library).
leaderElection:
  enabled: true
  resourceLockName: node-lifecycle-operator-leader

# Metrics endpoint (controller-runtime metrics serves on :8080 default ·
# Prometheus ServiceMonitor opt-in)
metrics:
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Health probe (controller-runtime health serves on :8081 default)
health:
  port: 8081

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
# ADR-0020 (P12-T-103): 部署 target = aarch64 鲲鹏 + 昇腾 910B. Soft node affinity
# 偏好 arm64(preferred · 非 required)→ 生产全 arm64 节点必匹配;amd64 dev/CI/kind
# 仍可调度(不破 render-verify / kind smoke).
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - arm64

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# crds.install drives whether the chart applies CRD YAML via pre-install
# hook. Set to false when CRDs are managed out-of-band (e.g. by GitOps
# tooling like Argo CD's IgnoreDifferences pattern · per Phase 12+
# Karmada cross-cluster CRD propagation rather than chart install hook).
crds:
  install: true
