apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-lifecycle-operator.fullname" . }}
  labels:
    {{- include "node-lifecycle-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "node-lifecycle-operator.selectorLabels" . | nindent 4 }}
