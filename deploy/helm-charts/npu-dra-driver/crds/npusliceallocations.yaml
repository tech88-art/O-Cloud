apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: npusliceallocations.npu.ocloud.edge.example.com
spec:
  group: npu.ocloud.edge.example.com
  names:
    kind: NPUSliceAllocation
    listKind: NPUSliceAllocationList
    plural: npusliceallocations
    shortNames:
    - npua
    singular: npusliceallocation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.claimRef.name
      name: Claim
      type: string
    - jsonPath: .spec.sliceRef.device
      name: Device
      type: string
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.aiCores
