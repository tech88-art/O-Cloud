apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npu-dra-driver.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "npu-dra-driver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "npu-dra-driver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "npu-dra-driver.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # P4-T-101: stamp the values-derived publisher/claim toggles
        # into pod annotations so kubectl describe surfaces what's
        # enabled without dumping argv.
        ocloud.edge.example.com/publisher-enabled: {{ .Values.publisher.enabled | quote }}
        ocloud.edge.example.com/claim-controller-enabled: {{ .Values.claimController.enabled | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "npu-dra-driver.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address={{ .Values.healthProbeBindAddress }}
            - --metrics-bind-address={{ .Values.metricsBindAddress }}
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- if .Values.publisher.enabled }}
            - --enable-publisher
            - --mock-data-path={{ .Values.publisher.mockDataPath }}
            {{- end }}
            {{- if .Values.claimController.enabled }}
            - --enable-claim-controller
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.publisher.enabled }}
          volumeMounts:
            - name: mock-data
              mountPath: /etc/npu-dra-driver/mock
              readOnly: true
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.publisher.enabled }}
      volumes:
        - name: mock-data
          configMap:
            name: {{ include "npu-dra-driver.mockConfigMapName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
