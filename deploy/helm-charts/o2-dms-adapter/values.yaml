# Default values for o2-dms-adapter (Phase 9 P9-T-008 scaffold).
#
# ADR-0013 §2 Decision D: standalone binary · port 8088 default ·
# read-only NB API (Phase 9) · authn placeholder static bearer Phase 9
# · Phase 10 polish OIDC + RBAC + Karmada multi-cluster propagation.

image:
  repository: o2-dms-adapter
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Service: ClusterIP exposing port 8088 (TCP).
service:
  type: ClusterIP
  port: 8088

# RBAC: read on NPUSlicePool + ModelService + NPUVerticalScaler +
# NPUSliceAllocation + Node + ResourceSlice; write on ModelService
# (only Create/Update/Delete needed for lifecycle endpoints in P9-T-104).
rbac:
  create: true

serviceAccount:
  create: true
  name: ""

# Pod-level securityContext per CLAUDE.md §6 禁止 + ADR-0013 §3
# Consequences (production-grade).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
# ADR-0020 (P12-T-103): 部署 target = aarch64 鲲鹏 + 昇腾 910B. Soft node affinity
# 偏好 arm64(preferred · 非 required)→ 生产全 arm64 节点必匹配;amd64 dev/CI/kind
# 仍可调度(不破 render-verify / kind smoke).
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - arm64

# Authentication mode selection(P11-T-106 · per ADR-0017 §2 Decision A
# Stream 5 part 1 substrate · 完整 OIDC IdP 部署 Keycloak/Dex 留 Phase
# 12+):
#
# - `placeholder`(Phase 9 default · DO NOT use in production)· static
#   bearer token in `auth.bearerToken`. Phase 10 P10-T-103 substrate
#   ships Validator interface · 此模式 仍走 PlaceholderValidator。
# - `oidc`(Phase 11 P11-T-106 substrate)· OIDC client validates tokens
#   against `auth.oidc.issuerUrl` + `auth.oidc.audience`. operators
#   provide issuer URL + audience via chart values · 完整 IdP deploy
#   (Keycloak/Dex)留 Phase 12+ per ADR-0017 主线 spine "Stream 5 part 2"
#   not in scope。
# - `tokenReview`(Phase 11 P11-T-106 substrate)· K8s ServiceAccount
#   TokenReview API · operators bind SA via auth.tokenReview.serviceAccountName。
#   chart RBAC 加 `authentication.k8s.io/v1.tokenreviews create` verb。
auth:
  # mode = placeholder | oidc | tokenReview
  mode: placeholder
  # Phase 9 legacy field — kept for placeholder mode backward compat.
  bearerToken: ""
  oidc:
    # OIDC issuer base URL(e.g. https://keycloak.example.com/realms/ocloud).
    # Empty when mode != oidc. validator dial issuer at startup to fetch
    # JWKS · 失败时 panic(per ADR-0013 §6 forward note authn 完整实现
    # § "OIDC client failed-fast init")。
    issuerUrl: ""
    # JWT audience claim the validator enforces. Typically the API
    # gateway / O2 DMS service identifier.
    audience: ""
  tokenReview:
    # SA whose token the validator presents to authentication.k8s.io/v1
    # TokenReview API. Empty triggers fallback to current Pod SA(via
    # rest.InClusterConfig).
    serviceAccountName: ""
