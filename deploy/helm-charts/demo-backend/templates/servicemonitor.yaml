{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "demo-backend.fullname" . }}
  {{- with .Values.serviceMonitor.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "demo-backend.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "demo-backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # Scrapes the 3 ADR-0015 §3.3 Decision D metrics:
      #   demo_backend_lease_holder (gauge · 1 on leader · 0 on follower/degraded)
      #   demo_backend_lease_renewals_total (counter · labeled by result)
      #   demo_backend_cache_hit_ratio (gauge · per-resource cache hit ratio)
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
