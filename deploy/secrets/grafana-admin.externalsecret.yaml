---
# =============================================================================
# ExternalSecret — grafana-admin (P13-T-203 · ADR-0025 §2 Decision B).
#
# Externalises the Grafana admin credential. The single-node DEMO values
# (deploy/single-node/values-kps.yaml) ship `grafana.adminPassword: admin`
# (the well-known demo login, surfaced in README as admin/admin). On a
# production real deployment that static password is replaced by THIS:
# kube-prometheus-stack's Grafana subchart reads an existing Secret when
# `grafana.admin.existingSecret` is set, with default keys admin-user /
# admin-password — which is exactly the shape produced here from Vault.
#
# Wire on the real deployment (the demo values-kps.yaml is out of T203's
# Allowed Paths — documented swap, not silently edited):
#   helm upgrade ... kube-prometheus-stack \
#     --set grafana.admin.existingSecret=grafana-admin
#
# Vault prereq (reference KV v2 layout):
#   secret/ocloud/grafana  →  { admin-user: admin, admin-password: <strong-pass> }
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ocloud-vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: admin-user
      remoteRef:
        key: ocloud/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: ocloud/grafana
        property: admin-password
