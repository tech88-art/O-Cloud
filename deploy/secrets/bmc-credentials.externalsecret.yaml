---
# =============================================================================
# ExternalSecret — BMC node credentials (P13-T-203 · ADR-0025 §2 Decision B ·
# closes ADR-0018 §4(c) "Phase 12+ Vault / external-secrets path replaces inline
# Secret with dynamic credential injection" forward note).
#
# The bare-metal-provisioning-operator's BareMetalNode.Spec.BMC.CredentialsRef
# points at a per-node Secret (username/password for Redfish/IPMI). The chart
# (deploy/helm-charts/bare-metal-provisioning-operator/values.yaml) documents
# the inline-Secret form as a DEMO default; THIS materialises the same Secret
# shape from Vault instead — no BMC password ever sits in YAML.
#
# REFERENCE for ONE node (node-01). A real fleet templates one ExternalSecret
# per node (or uses a generator); kept single + explicit as the reference.
# CUSTOMER SWAP: re-point remoteRef.key at the customer's Vault path layout.
#
# Vault prereq (reference KV v2 layout):
#   secret/ocloud/bmc/node-01  →  { username: <...>, password: <...> }
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bmc-node-01-creds
  namespace: ocloud-system
  labels:
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: bmc-credentials
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ocloud-vault
    kind: ClusterSecretStore
  target:
    # MUST match BareMetalNode.Spec.BMC.CredentialsRef.Name for node-01.
    name: bmc-node-01-creds
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: ocloud/bmc/node-01
        property: username
    - secretKey: password
      remoteRef:
        key: ocloud/bmc/node-01
        property: password
