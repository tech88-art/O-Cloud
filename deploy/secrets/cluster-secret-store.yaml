---
# =============================================================================
# ClusterSecretStore — REFERENCE Vault backend for External Secrets Operator
# (P13-T-203 · ADR-0025 §2 Decision B · §3 right-sizing · §4 swap point ·
#  承 ADR-0018 §4(c) BMC 动态凭据注入 forward note).
#
# THIS IS A REFERENCE WIRING, NOT A PRODUCTION SECRET BACKEND. It exists so the
# real profile can source every secret from an external manager (Vault) instead
# of inline/static YAML — end-to-end, with one documented swap point. The
# customer re-points `provider.vault.server` (+ auth) at their own Vault, or
# swaps the whole provider block for AWS/GCP/Azure secret managers (all
# first-class ESO providers). See deploy/secrets/README.md.
#
# Right-sized per ADR-0025 §3 (reference-grade, NOT gold-plated):
#   - a single ClusterSecretStore (cluster-scoped) — NOT per-namespace stores;
#   - Vault KV v2 at a single address — NOT a multi-region / HA Vault cluster
#     with auto-unseal (that is the customer's platform-Vault concern);
#   - Kubernetes auth (the ESO controller SA logs in to Vault with its
#     projected token) — NOT AppRole/TLS-cert auth (a customer-policy choice).
#
# Prereq: External Secrets Operator installed (scripts/install.sh --with-secrets
# or `helm install external-secrets ...` — see README) AND a reachable Vault
# with the `kubernetes` auth method + a `secret/` KV v2 mount + a role
# `external-secrets` bound to the ESO controller SA.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ocloud-vault
  labels:
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
spec:
  provider:
    vault:
      # CUSTOMER SWAP: the reference assumes an in-cluster Vault Service. Point
      # this at the customer's Vault (e.g. https://vault.corp.example.com:8200)
      # and provide its CA via caProvider / caBundle for TLS.
      server: "http://vault.vault.svc.cluster.local:8200"
      # KV v2 secrets engine mounted at `secret/` (the Vault default for KV v2).
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth: the ESO controller ServiceAccount's projected token
        # is exchanged for a Vault token. CUSTOMER SWAP: switch to appRole /
        # tokenSecretRef / TLS-cert per the customer's Vault auth policy.
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
