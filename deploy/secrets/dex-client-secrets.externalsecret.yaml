---
# =============================================================================
# ExternalSecret — dex-client-secrets (P13-T-203 · ADR-0025 §2 Decision B).
#
# PRODUCTION path for the Dex reference IdP's OIDC client secrets. This
# SUPERSEDES the inline `stringData` Secret in deploy/idp/dex.yaml (which is
# labelled DEMO ONLY · "DO-NOT-USE-IN-PROD" · self-contained offline fallback).
#
# In a Vault-backed install you apply THIS instead of the inline Secret:
#   - scripts/install.sh --with-secrets applies the ClusterSecretStore + this
#     ExternalSecret; the ESO controller materialises the `dex-client-secrets`
#     Secret (same name/namespace) from Vault, and Dex's existing secretKeyRef
#     env (deploy/idp/dex.yaml) consumes it unchanged.
#   - Do NOT apply the inline Secret block from dex.yaml in that case (it would
#     collide on the same name). See deploy/secrets/README.md §"Dex secrets".
#
# CUSTOMER SWAP: with the customer's own IdP, this whole file is irrelevant —
# the customer IdP owns its client-secret lifecycle. Kept here so the *reference*
# Dex path is fully externalised (no inline secret on the real profile).
#
# Vault prereq (reference KV v2 layout · README documents the `vault kv put`):
#   secret/ocloud/dex  →  { o2dms-client-secret: <...>, backend-client-secret: <...> }
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dex-client-secrets
  namespace: ocloud-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: ocloud-edge
    app.kubernetes.io/component: idp
    app.kubernetes.io/managed-by: ocloud-reference
    ocloud.edge.example.com/reference-only: "true"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ocloud-vault
    kind: ClusterSecretStore
  target:
    # MUST match the Secret name Dex's secretKeyRef expects (deploy/idp/dex.yaml).
    name: dex-client-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: o2dms-client-secret
      remoteRef:
        key: ocloud/dex
        property: o2dms-client-secret
    - secretKey: backend-client-secret
      remoteRef:
        key: ocloud/dex
        property: backend-client-secret
