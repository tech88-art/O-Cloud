---
# Propagate inference.ocloud.edge.example.com ModelService CR + linked
# Deployments/Services to all member clusters by default.
# Per ADR-0018 §2 Decision B PropagationPolicy templates · T103 落地.
#
# Phase 11: per-CRD propagation(选项 a per ADR-0018 §4 (b))· 所有
# ModelService instance 走同一 placement(clusterAffinity = all members).
# Phase 12+: per-resource override via ClusterPropagationPolicy + tag
# selector if per-tenant placement signal materialises.
#
# P13-T-205 (ADR-0025 §2 Decision D propagation hardening): adds propagateDeps
# (carry the ModelService's referenced ConfigMaps/Secrets along with it) +
# application failover — if a member cluster goes unhealthy, Karmada reschedules
# the divided replicas onto the surviving member after a toleration window and
# graciously drains the old placement.
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: modelservice-all-members
  namespace: ocloud-system
spec:
  # Carry dependent resources (referenced ConfigMaps / Secrets) to members
  # alongside the ModelService — they would otherwise be missing post-failover.
  propagateDeps: true
  resourceSelectors:
    - apiVersion: inference.ocloud.edge.example.com/v1alpha1
      kind: ModelService
    - apiVersion: apps/v1
      kind: Deployment
      labelSelector:
        matchLabels:
          inference.ocloud.edge.example.com/managed-by: inference-operator
    - apiVersion: v1
      kind: Service
      labelSelector:
        matchLabels:
          inference.ocloud.edge.example.com/managed-by: inference-operator
  placement:
    clusterAffinity:
      clusterNames:
        - member1
        - member2
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Weighted
      weightPreference:
        staticWeightList:
          - targetCluster:
              clusterNames:
                - member1
            weight: 1
          - targetCluster:
              clusterNames:
                - member2
            weight: 1
  # Application failover: when a target member cluster is reported unhealthy,
  # wait tolerationSeconds then reschedule this application's replicas to a
  # healthy member; purgeMode Graciously drains the old placement after the new
  # one is up (avoids a hard cut). Reference HA posture (ADR-0025 §3) — tune the
  # toleration to the customer's RTO.
  failover:
    application:
      decisionConditions:
        tolerationSeconds: 120
      purgeMode: Graciously
