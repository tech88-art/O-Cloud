# Karmada chart values overrides for Phase 11 P11-T-102 deployment.
# Per ADR-0018 §2 Decision B(upstream karmada-charts/karmada · direct
# chart · NOT karmada-operator)+ §4 Open question (a) Karmada HA留 Phase 12+.
#
# Phase 11 ships single Karmada control-plane(1 replica · 同 demo-backend
# ADR-0015 §3.3 active-standby + Lease 选主 posture)· production HA(3+
# replica + external etcd HA)留 Phase 12+ production hardening cohort.

# installMode = host: install Karmada control-plane components into the
# host cluster directly(suitable for kind / demo). Alternative "agent"
# mode is for member-cluster karmada-agent install only.
installMode: host

# Components disabled / reduced for demo footprint. Phase 12+ enables
# karmada-search + karmada-descheduler in production cohort.
components:
  - schedulerEstimator

# Phase 11 single-replica posture(per ADR-0018 §4 (a)).
apiServer:
  replicaCount: 1
controllerManager:
  replicaCount: 1
scheduler:
  replicaCount: 1
webhook:
  replicaCount: 1
aggregatedApiServer:
  replicaCount: 1

# etcd in-cluster mode for Phase 11(external etcd HA留 Phase 12+ per ADR-0018 §4 (a)).
etcd:
  mode: internal
  internal:
    replicaCount: 1
    storageClassName: ""    # default StorageClass · kind PV provisioner OK
    pvcSize: 1Gi

# certs: chart-managed self-signed(Phase 11 demo · Phase 12+ Vault path
# per ADR-0018 §4 (c)).
certs:
  mode: auto
