# Minimal Prometheus config for the local dev stack.
#
# The `backend` job points at the in-network service `backend:8080/metrics`.
# Until P1-T-204 lands the /metrics endpoint the scrape will fail (HTTP 404).
# That is intentional and graceful: Prometheus keeps running, and Grafana
# panels render as "No data" rather than crashing.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ocloud-dev
    environment: local

scrape_configs:
  # Prometheus scrapes itself so the UI has at least one healthy target.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Backend metrics endpoint (added by T204). Until then expect:
  #   instance="backend:8080", up=0
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: demo-backend

  # Placeholder for future Ascend NPU exporter (Phase 2).
  # Commented out so the file lints cleanly today.
  # - job_name: ascend-npu-exporter
  #   static_configs:
  #     - targets:
  #         - ascend-npu-exporter:9180
