# Minimal Prometheus config for the local dev stack.
#
# The `backend` job points at the in-network service `backend:8080/metrics`.
# Until P1-T-204 lands the /metrics endpoint the scrape will fail (HTTP 404).
# That is intentional and graceful: Prometheus keeps running, and Grafana
# panels render as "No data" rather than crashing.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ocloud-dev
    environment: local

scrape_configs:
  # Prometheus scrapes itself so the UI has at least one healthy target.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Backend metrics endpoint (added by T204). Until then expect:
  #   instance="backend:8080", up=0
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: demo-backend

  # Ascend NPU exporter — self-built `ascend-npu-exporter-plus` running
  # in simulator mode (P3-T-103, retired the P2-T-008 community chart +
  # nginx static-metrics stub). Opt in via the compose `--profile ascend`
  # (see docker-compose.yaml). Without the profile the target stays
  # `up=0` and Grafana shows "No data" — expected on hosts with no
  # Ascend silicon and no opt-in.
  - job_name: ascend-npu-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - ascend-npu-exporter-plus:9100
        labels:
          service: ascend-npu-exporter-plus
          source: dev-simulator

  # Host node-exporter (P11-fix-002) — backs the node-detail dashboard's
  # CPU / memory / network panels. Synthetic `node` label so the
  # dashboard `$node` template resolves under any worker-site-a-XX
  # value in set-a-small; on a real cluster this is one job per node.
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter
          node: worker-site-a-01
