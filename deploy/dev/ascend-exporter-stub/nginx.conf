# Single-file nginx config — serves /metrics from /usr/share/nginx/html.
#
# Used by the `ascend-npu-exporter-stub` service in docker-compose.yaml
# (profile `ascend`) to fake the real exporter on a non-NPU dev host.

worker_processes 1;
events { worker_connections 64; }

http {
    server {
        listen 8082 default_server;
        server_name _;

        location = /metrics {
            default_type text/plain;
            alias /usr/share/nginx/html/metrics.txt;
            add_header Cache-Control "no-store";
        }

        location = /healthz {
            return 200 "ok\n";
            default_type text/plain;
        }

        # Catch-all so probes hitting `/` don't 404 noisily.
        location / {
            return 200 "ascend-npu-exporter dev stub — try /metrics or /healthz\n";
            default_type text/plain;
        }
    }
}
