# P3-T-104 — minimal mock workload for the kind smoke spec.
#
# Purpose
# -------
#   Prove the k8s.Source serves /api/v1/workloads against the live API
#   server: the seeded Pod requests huawei.com/Ascend910=1 (matched by
#   the fake capacity install.sh patches into each worker node) and
#   carries the npu.huawei.com/slice-bindings annotation that the
#   Phase 5 PD Router (ADR-0008) will eventually write. Today the
#   annotation is purely advisory — the k8s.Source surfaces it on
#   model.Workload.Bindings via the same annotation contract used by
#   mock fixtures (configs/mock-data/set-a-small/workloads.json).
#
# Why pause:3.10
# --------------
#   We need a non-crashing container that doesn't try to do anything
#   with the requested Ascend910 device. pause is the canonical "this
#   pod exists but does nothing" image — it's what kubelet uses as
#   the infra container of every pod, so it's already cached on most
#   nodes. registry.k8s.io is the official mirror with no rate limits.
#
# Why no Deployment
# -----------------
#   A single Pod is enough for the workloads-list smoke. A Deployment
#   would force us to mirror Status.Replicas accounting against the
#   live cluster, which adds flakiness without buying coverage that
#   the existing unit tests don't already give us.
apiVersion: v1
kind: Pod
metadata:
  name: smoke-workload
  namespace: ocloud-system
  labels:
    app: smoke-workload
    ocloud.edge.example.com/managed-by: kind-smoke
    workload-type: inference
  annotations:
    # Single-binding shape matches model.Pod.Bindings JSON marshalling
    # (backend/pkg/model/workload.go). PD Router will populate this
    # at admission time in Phase 5; we hand-seed it here so the
    # k8s.Source has something concrete to round-trip.
    npu.huawei.com/slice-bindings: |
      [{"sliceId":"smoke-pool-slice-0","npuId":"worker-1-npu-0","template":"vir04"}]
spec:
  # Pin to a worker node (we patched capacity into worker nodes only).
  nodeSelector:
    site: site-a
  tolerations:
    - key: huawei.com/Ascend910B
      operator: Exists
      effect: NoSchedule
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          huawei.com/Ascend910: "1"
        limits:
          huawei.com/Ascend910: "1"
  restartPolicy: Never
