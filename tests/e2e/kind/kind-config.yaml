# P3-T-104 — kind cluster shape for the real-cluster E2E smoke job.
#
# Layout
# ------
#   1 control-plane + 2 workers. The control-plane stays untainted in
#   kind by default; we only need the workers to look like Ascend910B
#   hosts so that:
#     * the exporter-plus DaemonSet's nodeSelector
#       (huawei.com/Ascend910B: "true") schedules onto them, and
#     * the seeded smoke-workload Pod, which requests
#       huawei.com/Ascend910B=1, has a node to land on once
#       tests/e2e/kind/install.sh patches the fake extended-resource
#       capacity into each worker's status subresource.
#
# Why the labels live here but the capacity lives in install.sh
# -------------------------------------------------------------
#   kind v0.24 supports `nodes[*].labels` natively (set at kubelet
#   startup) but **does not** support setting `status.capacity` /
#   `status.allocatable` extended resources via the config file —
#   those have to be patched through the API server's status
#   subresource after node registration. install.sh's `up` step
#   does that with `kubectl patch node --subresource=status`.
#
# Port mappings
# -------------
#   30080 — demo-backend NodePort (manifests/demo-backend.yaml).
#   30090 — extra NodePort Service for ascend-npu-exporter-plus
#           created inline by install.sh (the chart's Service is
#           ClusterIP and doesn't expose a nodePort knob).
#   Both ports are mapped on the CONTROL-PLANE node only; kind
#   routes NodePort traffic to whichever pod hosts the Service
#   irrespective of which node the host port lands on.
#
# Image pin
# ---------
# 🆕 2026-05-21 update (P10-T-003 · 三件套 part 1):**kindest/node:v1.34.3**
# bumped from v1.32.0 · kind v0.31.0 supported set (lockstep with scheduler-plugin
# go.mod v0.34.7 cohort per docs/adr/0010-scheduler-plugin.md §1 + P10-T-003
# update segment). K8s 1.34 ships **DRA GA `resource.k8s.io/v1`** alongside
# `v1beta1` (backward compat preserved for Phase 5+ charts).
#
# Historical context (kept for trail):
#   kindest/node:v1.32.0 — picked at P5-T-112 / P5-T-114 for the kind
#   v0.25.0 supported set. K8s 1.32 has the v1.31 scheduler bug fixed
#   (cert-manager pods stayed Pending on 1.31 + DRA feature gate), but
#   DRA is STILL beta with feature gate default-OFF in 1.32 (graduates
#   to default-on at K8s 1.33). So we explicitly enable both:
#
#     featureGates:                          # required for scheduler
#       DynamicResourceAllocation: true        plugin + controller
#     runtimeConfig:                         # required for kube-apiserver
#       "resource.k8s.io/v1beta1": "true"      to serve the API
#
# Both knobs are needed: featureGates flips on the DRA plugins inside
# scheduler / controller-manager / kubelet; runtimeConfig flips on the
# api-server serving of resource.k8s.io/v1beta1. Without runtimeConfig,
# `kubectl apply -f deviceclass.yaml` fails with "no matches for kind
# DeviceClass in version resource.k8s.io/v1beta1" — which is exactly
# what blocked P5-T-113 e2e-kind run on commit a2c7325.
#
# Phase 5 charts apply `resource.k8s.io/v1beta1.DeviceClass` (T001)
# and the npu-dra-driver manager reads `ResourceSlice` / writes claim
# `status.allocation` on the same API version. Both manifests + the
# allocator package need v1beta1 served.
#
# P5-T-115 (2026-05-20): the top-level featureGates: + runtimeConfig:
# from T114 (commit 88aeb38) did NOT actually enable v1beta1 — the
# next CI run still failed at `helm install npu-dra-driver` with
# `no matches for kind "DeviceClass" in version "resource.k8s.io/v1beta1"`.
# Kind v0.25 apparently doesn't translate top-level runtimeConfig to
# kube-apiserver `--runtime-config` reliably for the slash-keyed entry
# `resource.k8s.io/v1beta1`. The robust way is `kubeadmConfigPatches`
# at the control-plane node, which we set explicitly here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ocloud-e2e
# Top-level featureGates kept as a hint + propagates to kubelet on every
# node (kind documents kubelet picks featureGates from cluster-level).
featureGates:
  DynamicResourceAllocation: true
nodes:
  - role: control-plane
    image: kindest/node:v1.34.3
    kubeadmConfigPatches:
      # Explicit kubeadm config — apiserver gets BOTH --feature-gates
      # AND --runtime-config; controller-manager + scheduler get
      # --feature-gates. kind passes these args through to the
      # respective kubeadm-managed static pods on the control plane.
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            feature-gates: "DynamicResourceAllocation=true"
            runtime-config: "resource.k8s.io/v1beta1=true"
        controllerManager:
          extraArgs:
            feature-gates: "DynamicResourceAllocation=true"
        scheduler:
          extraArgs:
            feature-gates: "DynamicResourceAllocation=true"
      - |
        kind: KubeletConfiguration
        featureGates:
          DynamicResourceAllocation: true
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.3
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            feature-gates: "DynamicResourceAllocation=true"
    labels:
      huawei.com/Ascend910B: "true"
      huawei.com/Ascend910B-Health: "Healthy"
      site: site-a
      role: edge
  - role: worker
    image: kindest/node:v1.34.3
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            feature-gates: "DynamicResourceAllocation=true"
    labels:
      huawei.com/Ascend910B: "true"
      huawei.com/Ascend910B-Health: "Healthy"
      site: site-a
      role: edge
