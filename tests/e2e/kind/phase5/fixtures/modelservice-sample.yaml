# Phase 5 P5-T-106 — minimal ModelService for the kind smoke.
#
# References the smoke-pool NPUSlicePool seeded by
# tests/e2e/kind/seed-resources.sh (Phase 3 T104 + Phase 4 T102
# combined; smoke-pool is in `ocloud-system` per the multi-tenancy
# convention).
#
# Replicas kept small (1 prefill + 1 decode = 2 Pods + 2 claims) so
# the smoke completes within the kind workflow's time budget even
# when image pulls / scheduling take longer than locally.
#
# Container image is `busybox:1.36` as a stand-in for the real
# vllm-ascend image. The smoke does NOT assert pod readiness or
# real inference traffic — only that the controller created the
# Pods + the PD Router webhook stamped the slice-bindings
# annotation. busybox keeps the test surface free of upstream
# vllm-ascend image-pull latency / ARM/AMD64 architecture mismatch.
apiVersion: inference.ocloud.edge.example.com/v1alpha1
kind: ModelService
metadata:
  name: smoke-ms
  namespace: ocloud-system
  labels:
    app.kubernetes.io/instance: smoke-ms
    app.kubernetes.io/managed-by: P5-T-106
spec:
  model:
    image: busybox:1.36
    modelPath: /models/smoke
  pdPair:
    prefill:
      replicas: 1
    decode:
      replicas: 1
    routerLabel: inference.ocloud.edge.example.com/pd-role
  npuSlicePoolRef:
    name: smoke-pool
