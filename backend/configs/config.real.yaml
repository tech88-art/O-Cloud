# O-Cloud demo-backend — REAL (physical-data) profile config.
#
# 真机交付版后端配置:大部分逻辑资源接真实数据源(in-cluster K8s API /
# Pool CRD / Prometheus / ConfigMap),demo 版的 config.dev.yaml 则全 mock。
# 两版只差这一份配置 —— 数据源抽象(backend/pkg/datasource + mapping.<resource>)
# 让切换零代码改动(见 config.example.yaml §P1-T-303 DATASET SWAP CONTRACT)。
#
# ✅ Phase-13 P13-T-103:mapping.topology 已切真源(k8s)—— k8s.Source.GetTopology
#   现从 live Node + Ascend 容量 + ResourceSlice device attr(npu.huawei.com/
#   hccs_ring + numa_node · real-Ascend DRA publisher P13-T-101 产出)聚合真拓扑,
#   不再返回 ErrCapabilityUnavailable(ADR-0024 §2 Decision C)。crd 源是等价备选
#   (读 NPUPool.status.hccsTopology · 已实现+测)→ 改本行为 `topology: crd` 即可。
# ✅ Phase-13 P13-T-104:mapping.deploy 已切真源(k8s)—— k8s.Source.Deploy/
#   DeleteDeploy 现 via client-go apply / delete Deployment+Service(label
#   app.kubernetes.io/managed-by=demo-backend + deploy.ocloud.io/id=<deployId>),
#   不再返回 ErrCapabilityUnavailable(ADR-0024 §2 Decision E)。前置:backend
#   ServiceAccount 需对 deployments + services 有 create/delete/list 权限
#   (RBAC 见 demo-backend chart ClusterRole / deploy/profiles/real values 备注)。
#   全部逻辑资源(clusters/nodes/npus/pools/workloads/metrics/presets/deploy/logs)
#   现已接真源 —— mock 数据源不再被任何 mapping 引用(下方 mock 块可在确认后关闭)。
# ✅ Phase-13 P13-T-203(Secret 管理 · ADR-0025 §2 Decision B):本配置**不含任何
#   secret**(刻意设计)—— prometheus.url / grafana.baseUrl 是 Service DNS 非凭据;
#   backend 以 in-cluster ServiceAccount 投影 token 认证 Prometheus(P13-T-201 ·
#   非静态 bearer)。故无 inline token 需外置。集群层 secret(Dex client / BMC 凭据)
#   走 External Secrets Operator + Vault(deploy/secrets/ · install.sh --with-secrets);
#   未来若本配置需引入 secret,经 env-from-Secret 注入(ESO 物化)· 不内联明文。
#
# 运行前置(README real profile 同步):
#   1) Pod 以 in-cluster ServiceAccount 跑(kubeconfig 留空)· RBAC 见
#      demo-backend chart / tests/e2e/kind/manifests/demo-backend.yaml ClusterRole。
#   2) Pool CRD 已 apply(operators/pool-operator/config/crd/bases/)→ crd.Source。
#   3) kube-prometheus-stack 已装,prometheus.url 指向其 in-cluster Service。
#   4) presets ConfigMap(ocloud-system/ocloud-presets · key=JSON PresetDetail)
#      已创建,否则 /api/v1/presets 会 500(presets:configmap 依赖它)。

server:
  port: 8080
  enableCORS: false        # 生产收紧 CORS(demo 版 dev 便利开着)

logging:
  level: info

# Grafana 嵌入 URL(/api/v1/grafana/url)。指向真实 Grafana,留空回退 dev。
grafana:
  baseUrl: ""

datasources:
  # mock 现已无 mapping 引用(deploy 也切 k8s 真源 · P13-T-104)。保留 enabled 仅为
  # 向后兼容 / 应急回退(改某 mapping.<res> 回 mock 即恢复 fixture 路径);真集群不依赖。
  mock:
    enabled: true
    path: "./configs/mock-data/set-a-small"
  # in-cluster ServiceAccount(kubeconfig 留空)。serves Clusters/Nodes/NPUs/
  # Workloads/Logs。
  k8s:
    enabled: true
    kubeconfig: ""
  # Pool CRD 读取(NPUSlicePool/NPUPool/NodePool/ClusterPool)。serves Pools。
  crd:
    enabled: true
    kubeconfig: ""
  # 真 Prometheus(kube-prometheus-stack in-cluster Service)。serves Metrics。
  # URL 必填 —— 留空 prometheus.NewSource 会启动报错。
  prometheus:
    enabled: true
    url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  # presets ConfigMap(<ns>/<name>)。serves Presets。
  configmap:
    enabled: true
    kubeconfig: ""
    path: "ocloud-system/ocloud-presets"

# resource → source 名。topology(P13-T-103)+ deploy(P13-T-104)均已切 k8s 真源;
# 全部资源接真源,无 mock 引用。
mapping:
  clusters: k8s
  topology: k8s           # P13-T-103: 真拓扑(ResourceSlice hccs_ring/numa_node) · 备选 crd
  nodes: k8s
  npus: k8s
  pools: crd
  workloads: k8s
  metrics: prometheus
  presets: configmap
  deploy: k8s             # P13-T-104: 真 Deploy()/DeleteDeploy()(apply Deployment+Service) · ADR-0024 §2 Decision E
  logs: k8s

cache:
  defaults:
    max_entries: 1024
    ttl: 5m
  per_resource:
    topology:
      max_entries: 64
      ttl: 30s
    workloads:
      max_entries: 256
      ttl: 1m
