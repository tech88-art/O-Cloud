# O-Cloud Edge Cloud demo-backend — full config example.
#
# Loaded via Viper. Env-var overrides use prefix OCEDGE_, e.g.
#   OCEDGE_SERVER_PORT=9000 ./demo-backend
#
# Field semantics:
#   server.port        : HTTP listen port. Default 8080.
#   server.enableCORS  : Toggle permissive CORS middleware (dev convenience).
#                        For production deployments narrow this.
#   datasources.<name> : Per-source config block. Each implementation reads
#                        its own subset of fields (enabled / path / kubeconfig
#                        / url …).
#   mapping.<resource> : Which source serves a given logical resource (used by
#                        pkg/datasource/factory.go to wire handlers).
#
# Phase-1 (P1-T-005) reads these fields but only mounts /healthz + /version
# until T101+ wires concrete handlers.
#
# ============================================================================
# P1-T-303 — DATASET SWAP CONTRACT
# ============================================================================
# "数据源切换只改配置" — the demo backend supports switching the active
# mock fixture directory without recompiling the binary. Two recipes:
#
#   1. SAME-NAMED SOURCE, DIFFERENT PATH (simplest):
#      Edit `datasources.mock.path` below, restart the process. The factory
#      hands the new path to mock.NewSource on startup; existing react-query
#      caches in the frontend invalidate on the next refresh.
#
#        datasources.mock.path: "./configs/mock-data/set-b-small"
#
#   2. NAMED VARIANTS (forward-looking; multi-source support is P1-T-307+):
#      Register multiple mock instances and flip `mapping.<resource>` between
#      them. main.go currently only wires "mock", but factory.go itself
#      handles mock-a / mock-b naming — see backend/pkg/datasource/factory_
#      test.go for the formal proof.
#
#        datasources:
#          mock-a: { enabled: true, path: "./configs/mock-data/set-a-small" }
#          mock-b: { enabled: true, path: "./configs/mock-data/set-b-small" }
#        mapping:
#          clusters: mock-a   # site-a infrastructure view
#          workloads: mock-b  # site-b workload view (mix-and-match for demos)
#
# The set-b-small fixture lands with P1-T-307 (演示数据集). Until then, the
# swap demo runs against set-a-small with itself.

server:
  port: 8080
  enableCORS: true

logging:
  level: info  # debug | info | warn | error

# Grafana embed URL (consumed by /api/v1/grafana/url, P1-T-205).
# Leave empty to fall back to http://localhost:3001 (dev docker-compose).
grafana:
  baseUrl: ""

datasources:
  mock:
    enabled: true
    # Swap path → swap dataset. set-a-small / set-c-stress are the two
    # canonical fixtures today; phase2-plan.md §3 walks through the
    # planned set-b-multi-site addition.
    path: "./configs/mock-data/set-a-small"
  # P2-T-006 wired k8s.Source. To use real K8s as the data path:
  #   1) enabled: true
  #   2) Kubeconfig: leave empty for in-cluster ServiceAccount (binary
  #      runs as a Pod), or path-on-disk for dev / E2E test runners.
  #   3) flip `mapping.<resource>` from `mock` → `k8s` per resource;
  #      mix-and-match is supported (mock workloads + k8s nodes is
  #      fine for piecemeal cutover).
  # k8s.Source today serves: Clusters / Nodes / NPUs / Workloads /
  # Logs. CRD pools + metrics + events land with later P2-T-1xx tasks.
  k8s:
    enabled: false
    kubeconfig: ""        # empty → in-cluster ServiceAccount
  # P2-T-007: prometheus.Source. Set `mapping.metrics: prometheus` to
  # route the Metrics page's QueryMetric calls to a real Prometheus
  # instead of the mock's synthesized series. URL is the HTTP API
  # root (no trailing slash needed; e.g. http://prometheus:9090).
  prometheus:
    enabled: false
    url: "http://prometheus:9090"
  # P2-T-101: crd.Source serves the Pools resource by reading
  # NPUSlicePool / NPUPool / NodePool / ClusterPool CRDs via the
  # dynamic client. Same kubeconfig chain as `k8s` (in-cluster SA
  # when path empty). Operators must apply the CRDs from
  # operators/pool-operator/config/crd/bases/ first.
  crd:
    enabled: false
    kubeconfig: ""
  # P2-T-103: configmap.Source serves the Presets resource by reading
  # a single ConfigMap whose data keys are JSON-encoded
  # model.PresetDetail records. `path` here is overloaded as a
  # `<namespace>/<name>` reference; empty falls back to the
  # `ocloud-system/ocloud-presets` default.
  configmap:
    enabled: false
    kubeconfig: ""
    path: "ocloud-system/ocloud-presets"

# resource → source-name. factory.SourceFor("clusters") consults this map.
# Same name throughout (Phase 1) → all resources from the same mock instance.
# For multi-source mixes see the header recipe #2.
mapping:
  clusters: mock
  topology: mock
  nodes: mock
  npus: mock
  pools: mock
  workloads: mock
  metrics: mock
  presets: mock
  deploy: mock
  logs: mock
